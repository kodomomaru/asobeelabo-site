    <circle cx="520" cy="40" r="2"/><circle cx="610" cy="130" r="1.5"/><circle cx="700" cy="60" r="2"/><circle cx="740" cy="180" r="1.5"/>
    <circle cx="60" cy="200" r="1.5"/><circle cx="360" cy="170" r="1.5"/>
