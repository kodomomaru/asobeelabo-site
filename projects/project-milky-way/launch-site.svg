  <ellipse cx="552" cy="233" rx="9" ry="7" fill="#ff4a3d"/>
  <rect x="470" y="372" width="10" height="20" fill="#d63b3b"/><rect x="540" y="372" width="10" height="20" fill="#d63b3b"/>
  <rect x="452" y="360" width="112" height="14" rx="6" fill="#f2f0ea"/>
  <rect x="462" y="370" width="90" height="4" fill="#4a5468"/>
  <ellipse cx="566" cy="367" rx="9" ry="7" fill="#7a3a36"/>
