    <rect x="358" y="92" width="40" height="120" fill="#2f4fa8"/><line x1="358" y1="112" x2="398" y2="112"/><line x1="358" y1="132" x2="398" y2="132"/><line x1="358" y1="152" x2="398" y2="152"/><line x1="358" y1="172" x2="398" y2="172"/><line x1="358" y1="192" x2="398" y2="192"/><line x1="378" y1="92" x2="378" y2="212"/>
  </g>
