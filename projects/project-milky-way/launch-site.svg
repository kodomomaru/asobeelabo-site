<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of a launch site under construction: a crane lowers the second solar wing onto a silver space telescope in its assembly stand, next to a starship with a saucer and warp nacelles, one nacelle still waiting on a cradle, a sign and traffic cones">
