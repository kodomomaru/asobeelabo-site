  <path d="M570 278 L600 250 L620 250 L596 280 Z" fill="#f2f0ea"/>
  <ellipse cx="636" cy="246" rx="82" ry="16" fill="#f2f0ea"/>
  <ellipse cx="636" cy="240" rx="34" ry="7" fill="#d4d8e0"/>
