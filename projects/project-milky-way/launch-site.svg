      <rect width="40" height="40" fill="#f6c026"/>
      <rect width="20" height="40" fill="#2b2f3a"/>
    </pattern>
  </defs>
  <rect width="800" height="450" rx="24" fill="#1c2140"/>
  <!-- stars and a planet -->
  <g fill="#fbf8f3">
