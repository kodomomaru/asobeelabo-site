  <!-- cones and tape -->
  <path d="M190 410 L204 360 L218 410 Z" fill="#ff7a2f"/><rect x="184" y="408" width="40" height="8" fill="#ff7a2f"/><rect x="198" y="380" width="12" height="7" fill="#fbf8f3"/>
  <path d="M700 410 L714 360 L728 410 Z" fill="#ff7a2f"/><rect x="694" y="408" width="40" height="8" fill="#ff7a2f"/><rect x="708" y="380" width="12" height="7" fill="#fbf8f3"/>
  <rect x="210" y="384" width="504" height="10" fill="url(#hz)"/>
