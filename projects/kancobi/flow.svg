<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of Classroom Flow: a branching path of checkpoints, with the current step highlighted and presenter controls">
  <rect width="800" height="450" rx="24" fill="#9b7bff" opacity="0.16"/>
  <rect x="40" y="36" width="720" height="378" rx="18" fill="#ffffff"/>
  <!-- the path -->
  <g stroke="#c9cdd8" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M140 210 H 290"/>
    <path d="M330 200 C 380 150, 400 130, 450 130"/>
    <path d="M330 220 C 380 270, 400 290, 450 290"/>
    <path d="M490 130 C 560 130, 570 200, 630 208"/>
    <path d="M490 290 C 560 290, 570 220, 630 214"/>
  </g>
  <path d="M140 210 H 290" stroke="#9b7bff" stroke-width="5" stroke-linecap="round"/>
  <g font-family="Fredoka, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#3a3f4b">
    <circle cx="120" cy="210" r="26" fill="#d9ccff"/><text x="120" y="215">1</text>
    <circle cx="310" cy="210" r="40" fill="#9b7bff" opacity=".25"/>
    <circle cx="310" cy="210" r="28" fill="#9b7bff"/><text x="310" y="215" fill="#fff">2</text>
    <circle cx="470" cy="130" r="24" fill="#e7e9f0"/><text x="470" y="135">3a</text>
    <circle cx="470" cy="290" r="24" fill="#e7e9f0"/><text x="470" y="295">3b</text>
    <circle cx="652" cy="211" r="26" fill="#e7e9f0"/><text x="652" y="216">4</text>
    <text x="120" y="262" font-size="13" font-weight="500" fill="#6a6f80">Warm-up</text>
    <text x="310" y="272" font-size="13" font-weight="500" fill="#6a6f80">Key idea</text>
    <text x="470" y="92" font-size="13" font-weight="500" fill="#6a6f80">Example</text>
    <text x="470" y="338" font-size="13" font-weight="500" fill="#6a6f80">Deep dive</text>
    <text x="652" y="262" font-size="13" font-weight="500" fill="#6a6f80">Recap</text>
  </g>
  <!-- followers' viewports -->
  <rect x="250" y="160" width="120" height="100" rx="10" fill="none" stroke="#ff5fa2" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="244" y="154" width="132" height="112" rx="12" fill="none" stroke="#4fc3a1" stroke-width="2" stroke-dasharray="7 6"/>
  <!-- presenter panel -->
  <g font-family="sans-serif" font-size="14">
    <rect x="234" y="356" width="332" height="44" rx="22" fill="#3a3f4b"/>
    <rect x="246" y="364" width="84" height="28" rx="14" fill="#5b6170"/><text x="262" y="383" fill="#fff">← Prev</text>
    <rect x="340" y="364" width="120" height="28" rx="14" fill="#9b7bff"/><text x="356" y="383" fill="#fff">Next: 3a / 3b</text>
    <rect x="470" y="364" width="84" height="28" rx="14" fill="#5b6170"/><text x="492" y="383" fill="#fff">End</text>
  </g>
  <!-- someone stepped away -->
  <rect x="604" y="58" width="134" height="30" rx="15" fill="#f4f1ff" stroke="#c4b5fd"/>
  <text x="618" y="78" font-family="sans-serif" font-size="13" fill="#7c6bc4">↩ Return to flow</text>
</svg>
