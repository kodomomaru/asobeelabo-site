<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of a Kanban board on the Kancobi canvas next to the sticky notes it came from">
  <rect width="800" height="450" rx="24" fill="#9b7bff" opacity="0.16"/>
  <rect x="40" y="36" width="720" height="378" rx="18" fill="#ffffff"/>
  <!-- notes it came from -->
  <g font-family="sans-serif" font-size="13" fill="#3a3f4b">
    <rect x="66" y="76" width="84" height="80" rx="6" fill="#fde047" transform="rotate(-4 108 116)"/>
    <text x="78" y="112" transform="rotate(-4 108 116)">Survey</text>
    <rect x="76" y="186" width="84" height="80" rx="6" fill="#f9a8d4" transform="rotate(3 118 226)"/>
    <text x="88" y="222" transform="rotate(3 118 226)">Prototype</text>
    <rect x="66" y="296" width="84" height="80" rx="6" fill="#93c5fd" transform="rotate(-2 108 336)"/>
    <text x="78" y="332" transform="rotate(-2 108 336)">Pilot</text>
  </g>
  <path d="M176 226 h46" stroke="#9b7bff" stroke-width="4" stroke-linecap="round"/>
  <path d="M214 214 l14 12 -14 12" fill="none" stroke="#9b7bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the board -->
  <rect x="246" y="66" width="490" height="324" rx="14" fill="#f4f1ff" stroke="#c4b5fd" stroke-width="2"/>
  <g font-family="Fredoka, sans-serif" font-size="16" font-weight="600" fill="#3a3f4b">
    <rect x="262" y="82" width="146" height="32" rx="8" fill="#f9a8d4"/><text x="276" y="104">To do</text>
    <rect x="418" y="82" width="146" height="32" rx="8" fill="#fde047"/><text x="432" y="104">In progress</text>
    <rect x="574" y="82" width="146" height="32" rx="8" fill="#86efac"/><text x="588" y="104">Done</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#3a3f4b">
    <g><rect x="262" y="126" width="146" height="62" rx="8" fill="#fff" stroke="#e2dbff"/><rect x="262" y="126" width="146" height="6" rx="3" fill="#f9a8d4"/><text x="274" y="154">Write survey</text><circle cx="392" cy="172" r="8" fill="#ff5fa2"/></g>
    <g><rect x="262" y="198" width="146" height="62" rx="8" fill="#fff" stroke="#e2dbff"/><rect x="262" y="198" width="146" height="6" rx="3" fill="#f9a8d4"/><text x="274" y="226">Book the room</text><circle cx="392" cy="244" r="8" fill="#64b5f6"/></g>
    <g><rect x="418" y="126" width="146" height="62" rx="8" fill="#fff" stroke="#e2dbff"/><rect x="418" y="126" width="146" height="6" rx="3" fill="#fde047"/><text x="430" y="154">Paper prototype</text><circle cx="548" cy="172" r="8" fill="#4fc3a1"/></g>
    <g><rect x="574" y="126" width="146" height="62" rx="8" fill="#fff" stroke="#e2dbff"/><rect x="574" y="126" width="146" height="6" rx="3" fill="#86efac"/><text x="586" y="154">Kick-off</text><text x="694" y="178" font-size="14">✓</text></g>
    <g><rect x="574" y="198" width="146" height="62" rx="8" fill="#fff" stroke="#e2dbff"/><rect x="574" y="198" width="146" height="6" rx="3" fill="#86efac"/><text x="586" y="226">Brainstorm</text><text x="694" y="250" font-size="14">✓</text></g>
  </g>
  <!-- add task / add column -->
  <rect x="262" y="272" width="146" height="34" rx="8" fill="none" stroke="#c4b5fd" stroke-dasharray="6 5"/>
  <text x="300" y="294" font-family="sans-serif" font-size="13" fill="#7c6bc4">+ Add task</text>
  <rect x="418" y="200" width="146" height="62" rx="8" fill="#fff" stroke="#9b7bff" stroke-width="2" stroke-dasharray="6 5" opacity=".7"/>
  <path d="M500 240 l0 24 6 -6 6 12 5 -2 -6 -12 9 0z" fill="#ffb74d" stroke="#fff" stroke-width="1.5"/>
</svg>
