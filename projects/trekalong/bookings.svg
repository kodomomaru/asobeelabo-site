<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of Trek Along reading a ticket: a boarding pass photo on the left, the flight details filled in on the right, and a receipt linked to the booking">
  <rect width="800" height="450" rx="24" fill="#1fa2b8" opacity="0.12"/>
  <!-- ticket photo -->
  <g transform="rotate(-5 200 210)">
    <rect x="60" y="90" width="290" height="150" rx="14" fill="#fff"/>
    <rect x="60" y="90" width="290" height="40" rx="14" fill="#ff8a65"/><rect x="60" y="114" width="290" height="16" fill="#ff8a65"/>
    <text x="78" y="117" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">BOARDING PASS</text>
    <g font-family="sans-serif" fill="#24414a">
      <text x="78" y="172" font-size="30" font-weight="700">SIN</text><text x="168" y="168" font-size="20">✈</text><text x="210" y="172" font-size="30" font-weight="700">KIX</text>
      <text x="78" y="200" font-size="12" fill="#6a7f86">FLIGHT  SQ 618   GATE  B4</text>
      <text x="78" y="220" font-size="12" fill="#6a7f86">DEP 01:10   SEAT 32A</text>
    </g>
    <line x1="290" y1="140" x2="290" y2="232" stroke="#cfd8dc" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="304" y="150" width="34" height="74" fill="#24414a" opacity=".8"/>
  </g>
  <!-- scan line -->
  <rect x="48" y="166" width="316" height="6" rx="3" fill="#1fa2b8" opacity=".85"/>
  <path d="M380 180 h40" stroke="#1fa2b8" stroke-width="5" stroke-linecap="round"/><path d="M414 168 l14 12 l-14 12" fill="none" stroke="#1fa2b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- filled booking -->
  <rect x="450" y="40" width="300" height="250" rx="18" fill="#fff"/>
  <text x="472" y="76" font-family="sans-serif" font-size="18" font-weight="700" fill="#24414a">New flight</text>
  <rect x="660" y="58" width="72" height="24" rx="12" fill="#e6f6f8"/><text x="672" y="75" font-family="sans-serif" font-size="12" fill="#1fa2b8">read ✓</text>
  <g font-family="sans-serif" font-size="12" fill="#6a7f86">
    <text x="472" y="106">From</text><text x="612" y="106">To</text>
    <text x="472" y="166">Departs (local)</text><text x="612" y="166">Arrives (local)</text>
    <text x="472" y="226">Flight</text><text x="612" y="226">Seat</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#24414a">
    <rect x="468" y="114" width="128" height="34" rx="9" fill="#f4f6f8"/><text x="480" y="136">Singapore</text>
    <rect x="608" y="114" width="128" height="34" rx="9" fill="#f4f6f8"/><text x="620" y="136">Osaka KIX</text>
    <rect x="468" y="174" width="128" height="34" rx="9" fill="#f4f6f8"/><text x="480" y="196">01:10 SGT</text>
    <rect x="608" y="174" width="128" height="34" rx="9" fill="#f4f6f8"/><text x="620" y="196">08:40 JST</text>
    <rect x="468" y="234" width="128" height="34" rx="9" fill="#f4f6f8"/><text x="480" y="256">SQ 618</text>
    <rect x="608" y="234" width="128" height="34" rx="9" fill="#f4f6f8"/><text x="620" y="256">32A</text>
  </g>
  <!-- receipt -->
  <path d="M470 312 h150 v100 l-12 -8 l-12 8 l-12 -8 l-12 8 l-12 -8 l-12 8 l-12 -8 l-12 8 l-12 -8 l-12 8 l-12 -8 l-12 8 z" fill="#fff"/>
  <g fill="#cfd8dc"><rect x="486" y="330" width="90" height="8" rx="4"/><rect x="486" y="348" width="118" height="6" rx="3"/><rect x="486" y="362" width="100" height="6" rx="3"/></g>
  <text x="486" y="390" font-family="sans-serif" font-size="14" font-weight="700" fill="#24414a">¥ 3,480</text>
  <path d="M630 360 C660 360 660 330 690 330" stroke="#1fa2b8" stroke-width="3" fill="none" stroke-dasharray="6 5"/>
  <rect x="690" y="314" width="60" height="32" rx="10" fill="#1fa2b8"/><text x="704" y="335" font-family="sans-serif" font-size="13" fill="#fff">Stay</text>
  <!-- night flag -->
  <rect x="60" y="300" width="320" height="56" rx="14" fill="#fff4e5"/>
  <text x="80" y="334" font-family="sans-serif" font-size="14" fill="#a85a00">⚠ Night of 14 Apr has no stay yet</text>
</svg>
