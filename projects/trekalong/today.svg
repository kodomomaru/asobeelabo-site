<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of Trek Along's Today view on a phone: what's on now and next on the trip's clock, with an offline badge">
  <rect width="800" height="450" rx="24" fill="#1fa2b8" opacity="0.12"/>
  <rect x="290" y="18" width="220" height="414" rx="30" fill="#24414a"/>
  <rect x="300" y="28" width="200" height="394" rx="22" fill="#f7fafb"/>
  <rect x="300" y="28" width="200" height="70" rx="22" fill="#1fa2b8"/><rect x="300" y="70" width="200" height="28" fill="#1fa2b8"/>
  <g font-family="sans-serif">
    <text x="316" y="62" font-size="20" font-weight="700" fill="#fff">Today</text>
    <text x="316" y="86" font-size="12" fill="#e0f7fa">Day 3 · Osaka · 10:05 JST</text>
    <rect x="430" y="44" width="58" height="20" rx="10" fill="#fff" opacity=".9"/><text x="438" y="58" font-size="10" fill="#1fa2b8">● offline</text>
    <text x="314" y="122" font-size="11" fill="#6a7f86">NOW</text>
    <rect x="312" y="130" width="176" height="80" rx="12" fill="#fff" stroke="#1fa2b8" stroke-width="2"/>
    <text x="326" y="156" font-size="14" font-weight="700" fill="#24414a">🚆 Train to Osaka</text>
    <text x="326" y="176" font-size="12" fill="#6a7f86">10:12 · platform 3</text>
    <rect x="326" y="188" width="148" height="8" rx="4" fill="#e6f6f8"/><rect x="326" y="188" width="60" height="8" rx="4" fill="#1fa2b8"/>
    <text x="314" y="234" font-size="11" fill="#6a7f86">NEXT</text>
    <rect x="312" y="242" width="176" height="56" rx="12" fill="#fff"/>
    <text x="326" y="266" font-size="14" fill="#24414a">🏨 Check in, hotel</text><text x="326" y="286" font-size="12" fill="#6a7f86">15:00</text>
    <rect x="312" y="306" width="176" height="56" rx="12" fill="#fff"/>
    <text x="326" y="330" font-size="14" fill="#24414a">Dotonbori food walk</text><text x="326" y="350" font-size="12" fill="#6a7f86">19:00</text>
    <rect x="312" y="372" width="176" height="36" rx="12" fill="#fff4e5"/><text x="326" y="395" font-size="12" fill="#a85a00">☂ Rain after 16:00</text>
  </g>
  <!-- clocks -->
  <g font-family="sans-serif">
    <circle cx="150" cy="190" r="70" fill="#fff"/><circle cx="150" cy="190" r="6" fill="#24414a"/>
    <path d="M150 190 L150 140" stroke="#24414a" stroke-width="6" stroke-linecap="round"/><path d="M150 190 L190 188" stroke="#1fa2b8" stroke-width="5" stroke-linecap="round"/>
    <text x="150" y="296" font-size="16" font-weight="700" fill="#24414a" text-anchor="middle">Trip clock</text>
    <text x="150" y="318" font-size="13" fill="#6a7f86" text-anchor="middle">Osaka, JST</text>
    <circle cx="650" cy="190" r="56" fill="#fff" opacity=".6"/><circle cx="650" cy="190" r="5" fill="#90a4ae"/>
    <path d="M650 190 L650 152" stroke="#90a4ae" stroke-width="5" stroke-linecap="round"/><path d="M650 190 L622 196" stroke="#90a4ae" stroke-width="4" stroke-linecap="round"/>
    <text x="650" y="282" font-size="14" fill="#90a4ae" text-anchor="middle">Home time, not used</text>
  </g>
</svg>
