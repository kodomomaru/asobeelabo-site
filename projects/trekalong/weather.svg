<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of Trek Along's weather: a forecast strip for each stop, three-hourly detail, and later days marked as typical weather">
  <rect width="800" height="450" rx="24" fill="#1fa2b8" opacity="0.12"/>
  <g font-family="sans-serif">
    <text x="48" y="74" font-size="20" font-weight="700" fill="#24414a">Kyoto</text><text x="128" y="74" font-size="13" fill="#6a7f86">stop 1 · forecast</text>
    <g>
      <rect x="44" y="92" width="130" height="150" rx="16" fill="#fff"/><text x="62" y="118" font-size="13" fill="#6a7f86">Mon</text><circle cx="109" cy="160" r="22" fill="#ffc94d"/><text x="62" y="222" font-size="18" font-weight="700" fill="#24414a">21° / 12°</text>
      <rect x="188" y="92" width="130" height="150" rx="16" fill="#fff"/><text x="206" y="118" font-size="13" fill="#6a7f86">Tue</text><circle cx="244" cy="152" r="18" fill="#ffc94d"/><ellipse cx="262" cy="166" rx="30" ry="15" fill="#cfd8dc"/><text x="206" y="222" font-size="18" font-weight="700" fill="#24414a">18° / 11°</text>
      <rect x="332" y="92" width="130" height="150" rx="16" fill="#fff"/><text x="350" y="118" font-size="13" fill="#6a7f86">Wed</text><ellipse cx="397" cy="155" rx="32" ry="16" fill="#90a4ae"/><g stroke="#64b5f6" stroke-width="4" stroke-linecap="round"><path d="M384 180 l-4 10"/><path d="M398 180 l-4 10"/><path d="M412 180 l-4 10"/></g><text x="350" y="222" font-size="18" font-weight="700" fill="#24414a">15° / 10°</text>
    </g>
    <!-- 3-hourly -->
    <rect x="44" y="262" width="418" height="148" rx="16" fill="#fff"/>
    <text x="62" y="290" font-size="13" fill="#6a7f86">EVERY 3 HOURS · TUE</text>
    <polyline points="72,370 128,350 184,326 240,312 296,318 352,340 408,362" fill="none" stroke="#ff8a65" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#ff8a65"><circle cx="72" cy="370" r="5"/><circle cx="128" cy="350" r="5"/><circle cx="184" cy="326" r="5"/><circle cx="240" cy="312" r="5"/><circle cx="296" cy="318" r="5"/><circle cx="352" cy="340" r="5"/><circle cx="408" cy="362" r="5"/></g>
    <g font-size="11" fill="#6a7f86" text-anchor="middle"><text x="72" y="396">06</text><text x="128" y="396">09</text><text x="184" y="396">12</text><text x="240" y="396">15</text><text x="296" y="396">18</text><text x="352" y="396">21</text><text x="408" y="396">00</text></g>
    <!-- typical -->
    <text x="500" y="74" font-size="20" font-weight="700" fill="#24414a">Osaka</text><text x="574" y="74" font-size="13" fill="#6a7f86">in 3 weeks</text>
    <rect x="496" y="92" width="264" height="318" rx="16" fill="#fff" stroke="#b0bec5" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="516" y="110" width="98" height="26" rx="13" fill="#eceff1"/><text x="530" y="128" font-size="13" fill="#546e7a">Typical</text>
    <text x="516" y="164" font-size="13" fill="#6a7f86">Averaged over the last 5 years</text>
    <g>
      <circle cx="560" cy="230" r="30" fill="#ffc94d" opacity=".75"/><ellipse cx="590" cy="250" rx="44" ry="22" fill="#cfd8dc"/>
      <text x="660" y="244" font-size="26" font-weight="700" fill="#24414a">19°</text>
    </g>
    <g font-size="14" fill="#24414a"><text x="516" y="316">Rain on 4 of 10 days</text><text x="516" y="344">Highs 17–22°</text><text x="516" y="372">Lows 9–13°</text></g>
  </g>
</svg>
