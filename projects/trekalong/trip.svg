<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of a Trek Along trip: a map with three numbered stops joined by a route, saved places with votes, and the group's avatars">
  <rect width="800" height="450" rx="24" fill="#1fa2b8" opacity="0.12"/>
  <!-- map card -->
  <rect x="40" y="40" width="460" height="370" rx="20" fill="#dff3f6"/>
  <path d="M40 120 C120 90 170 150 240 120 S380 60 500 100 V410 H40 Z" fill="#e9f5e1"/>
  <path d="M40 260 C110 230 200 300 300 260 S440 230 500 270 V410 H40 Z" fill="#d4ecc6"/>
  <path d="M330 40 C340 120 300 170 360 230 S420 330 400 410" stroke="#b9e2ea" stroke-width="14" fill="none"/>
  <g stroke="#ffffff" stroke-width="4" opacity=".8" fill="none"><path d="M60 330 L470 180"/><path d="M120 60 L220 400"/></g>
  <path d="M110 320 C160 250 220 240 250 200 S330 140 420 120" stroke="#1fa2b8" stroke-width="5" stroke-dasharray="12 9" fill="none" stroke-linecap="round"/>
  <g font-family="sans-serif" font-weight="700" font-size="16" fill="#fff" text-anchor="middle">
    <circle cx="110" cy="320" r="18" fill="#1fa2b8"/><text x="110" y="326">1</text>
    <circle cx="250" cy="200" r="18" fill="#1fa2b8"/><text x="250" y="206">2</text>
    <circle cx="420" cy="120" r="18" fill="#1fa2b8"/><text x="420" y="126">3</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#24414a">
    <rect x="128" y="334" width="76" height="24" rx="12" fill="#fff"/><text x="141" y="351">Kyoto</text>
    <rect x="268" y="214" width="76" height="24" rx="12" fill="#fff"/><text x="281" y="231">Osaka</text>
    <rect x="330" y="140" width="80" height="24" rx="12" fill="#fff"/><text x="343" y="157">Nara</text>
  </g>
  <circle cx="190" cy="270" r="9" fill="#ff8a65"/><circle cx="330" cy="300" r="9" fill="#ff8a65"/><circle cx="390" cy="210" r="9" fill="#ff8a65"/>
  <!-- trip header -->
  <rect x="530" y="40" width="230" height="110" rx="18" fill="#fff"/>
  <text x="550" y="76" font-family="sans-serif" font-size="20" font-weight="700" fill="#24414a">Japan, spring</text>
  <text x="550" y="100" font-family="sans-serif" font-size="13" fill="#6a7f86">3 stops · 9 days · JPY</text>
  <g stroke="#fff" stroke-width="3">
    <circle cx="566" cy="126" r="13" fill="#ffb74d"/><circle cx="588" cy="126" r="13" fill="#64b5f6"/><circle cx="610" cy="126" r="13" fill="#ba68c8"/><circle cx="632" cy="126" r="13" fill="#81c784"/>
  </g>
  <rect x="660" y="114" width="84" height="24" rx="12" fill="#1fa2b8"/><text x="676" y="131" font-family="sans-serif" font-size="13" fill="#fff">Invite +</text>
  <!-- places with votes -->
  <text x="534" y="182" font-family="sans-serif" font-size="12" fill="#6a7f86">PLACES TO SEE</text>
  <g font-family="sans-serif" font-size="14" fill="#24414a">
    <rect x="530" y="192" width="230" height="62" rx="14" fill="#fff"/><rect x="542" y="204" width="38" height="38" rx="8" fill="#ff8a65"/>
    <text x="592" y="222">Fushimi Inari</text><text x="592" y="242" font-size="12" fill="#6a7f86">♥ 4 votes</text>
    <rect x="530" y="264" width="230" height="62" rx="14" fill="#fff"/><rect x="542" y="276" width="38" height="38" rx="8" fill="#81c784"/>
    <text x="592" y="294">Nara Park</text><text x="592" y="314" font-size="12" fill="#6a7f86">♥ 3 votes</text>
    <rect x="530" y="336" width="230" height="62" rx="14" fill="#fff"/><rect x="542" y="348" width="38" height="38" rx="8" fill="#64b5f6"/>
    <text x="592" y="366">Dotonbori</text><text x="592" y="386" font-size="12" fill="#6a7f86">♥ 2 votes</text>
  </g>
</svg>
