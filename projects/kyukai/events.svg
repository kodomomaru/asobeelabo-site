<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of a Kyukai progression format built from stages: qualifying rounds, a cut on top scores, sudden death and closest to centre">
  <rect width="800" height="450" rx="24" fill="#d9482b" opacity="0.12"/>
  <rect x="40" y="36" width="720" height="378" rx="18" fill="#f5efe3"/>
  <text x="70" y="82" font-family="'Shippori Mincho', Georgia, serif" font-size="24" font-weight="700" fill="#2b2522">Progression format</text>
  <rect x="560" y="60" width="170" height="30" rx="15" fill="#fff" stroke="#e2d8c4"/>
  <text x="578" y="80" font-family="sans-serif" font-size="13" fill="#8a7f70">Preset: Group Playoff</text>
  <!-- wizard steps -->
  <g font-family="sans-serif" font-size="11" fill="#8a7f70">
    <circle cx="80" cy="118" r="8" fill="#d9482b"/><text x="94" y="122">Detail</text>
    <circle cx="160" cy="118" r="8" fill="#d9482b"/><text x="174" y="122">Type</text>
    <circle cx="232" cy="118" r="8" fill="#d9482b"/><text x="246" y="122">Team 5 + 1</text>
    <circle cx="336" cy="118" r="8" fill="#fff" stroke="#d9482b" stroke-width="3"/><text x="350" y="122" fill="#2b2522">Format</text>
    <circle cx="424" cy="118" r="8" fill="#e2d8c4"/><text x="438" y="122">Teams (CSV)</text>
    <circle cx="530" cy="118" r="8" fill="#e2d8c4"/><text x="544" y="122">Summary</text>
  </g>
  <!-- stages -->
  <g font-family="sans-serif" font-size="13" fill="#2b2522">
    <rect x="70" y="160" width="190" height="120" rx="12" fill="#fff"/>
    <rect x="70" y="160" width="190" height="8" rx="4" fill="#3b4a8a"/>
    <text x="86" y="194" font-weight="700">1 · Rounds</text><text x="86" y="216" fill="#8a7f70">2 rounds × 4 arrows</text>
    <text x="86" y="244" fill="#8a7f70">Top 8 scores go on</text>
    <rect x="300" y="160" width="190" height="120" rx="12" fill="#fff"/>
    <rect x="300" y="160" width="190" height="8" rx="4" fill="#d9482b"/>
    <text x="316" y="194" font-weight="700">2 · Sudden death</text><text x="316" y="216" fill="#8a7f70">Miss and you're out</text>
    <text x="316" y="244" fill="#8a7f70">Until 3 remain</text>
    <rect x="530" y="160" width="200" height="120" rx="12" fill="#fff"/>
    <rect x="530" y="160" width="200" height="8" rx="4" fill="#c9a227"/>
    <text x="546" y="194" font-weight="700">3 · Closest to centre</text><text x="546" y="216" fill="#8a7f70">One arrow each</text>
    <text x="546" y="244" fill="#8a7f70">Decides 1st – 3rd</text>
  </g>
  <g stroke="#d9482b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M266 220 h26"/><path d="M284 212 l8 8 -8 8"/>
    <path d="M496 220 h26"/><path d="M514 212 l8 8 -8 8"/>
  </g>
  <!-- generated rules -->
  <rect x="70" y="304" width="660" height="88" rx="12" fill="#fff" stroke="#e2d8c4"/>
  <text x="86" y="330" font-family="sans-serif" font-size="11" fill="#8a7f70">RULES (WRITTEN FROM THE STAGES)</text>
  <rect x="86" y="344" width="520" height="10" rx="5" fill="#e2d8c4"/>
  <rect x="86" y="364" width="420" height="10" rx="5" fill="#e2d8c4"/>
</svg>
