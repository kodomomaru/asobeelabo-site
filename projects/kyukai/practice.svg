<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of the Kyukai practice log: a 12-arrow hit-rate set, averages and a trend chart">
  <rect width="800" height="450" rx="24" fill="#d9482b" opacity="0.12"/>
  <rect x="40" y="36" width="720" height="378" rx="18" fill="#f5efe3"/>
  <text x="70" y="82" font-family="'Shippori Mincho', Georgia, serif" font-size="24" font-weight="700" fill="#2b2522">Practice</text>
  <!-- current set -->
  <rect x="70" y="104" width="300" height="150" rx="14" fill="#fff"/>
  <text x="88" y="132" font-family="sans-serif" font-size="12" fill="#8a7f70">12-ARROW SET · 9 / 12</text>
  <g transform="translate(96 160)" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="10" stroke="#2b2522"/><circle cx="34" cy="0" r="10" stroke="#2b2522"/><path d="M58 -8 l16 16 M74 -8 l-16 16" stroke="#d9482b"/><circle cx="102" cy="0" r="10" stroke="#2b2522"/><circle cx="136" cy="0" r="10" stroke="#2b2522"/><path d="M160 -8 l16 16 M176 -8 l-16 16" stroke="#d9482b"/>
    <circle cx="0" cy="36" r="10" stroke="#2b2522"/><circle cx="34" cy="36" r="10" stroke="#2b2522"/><circle cx="68" cy="36" r="10" stroke="#2b2522"/>
    <circle cx="102" cy="36" r="10" stroke="#d6cbb6" stroke-dasharray="3 4"/><circle cx="136" cy="36" r="10" stroke="#d6cbb6" stroke-dasharray="3 4"/><circle cx="170" cy="36" r="10" stroke="#d6cbb6" stroke-dasharray="3 4"/>
  </g>
  <g font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="88" y="212" width="124" height="30" rx="15" fill="#2b2522"/><text x="150" y="232" fill="#fff">○ Hit</text>
    <rect x="226" y="212" width="124" height="30" rx="15" fill="#d9482b"/><text x="288" y="232" fill="#fff">× Miss</text>
  </g>
  <!-- averages -->
  <g font-family="sans-serif">
    <rect x="70" y="272" width="142" height="112" rx="14" fill="#fff"/>
    <text x="88" y="300" font-size="12" fill="#8a7f70">Overall</text>
    <text x="88" y="350" font-family="'Shippori Mincho', Georgia, serif" font-size="36" font-weight="700" fill="#2b2522">64%</text>
    <rect x="228" y="272" width="142" height="112" rx="14" fill="#fff"/>
    <text x="246" y="300" font-size="12" fill="#8a7f70">Last 10 sets</text>
    <text x="246" y="350" font-family="'Shippori Mincho', Georgia, serif" font-size="36" font-weight="700" fill="#d9482b">71%</text>
  </g>
  <!-- trend chart -->
  <rect x="400" y="104" width="330" height="280" rx="14" fill="#fff"/>
  <text x="420" y="132" font-family="sans-serif" font-size="12" fill="#8a7f70">HIT RATE PER SET</text>
  <g stroke="#efe6d4" stroke-width="1.5"><path d="M430 180 H710 M430 240 H710 M430 300 H710 M430 360 H710"/></g>
  <polyline points="440,320 470,300 500,312 530,280 560,290 590,258 620,266 650,236 680,222 706,214" fill="none" stroke="#d9482b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#d9482b"><circle cx="440" cy="320" r="5"/><circle cx="530" cy="280" r="5"/><circle cx="620" cy="266" r="5"/><circle cx="706" cy="214" r="6"/></g>
  <text x="626" y="200" font-family="sans-serif" font-size="12" fill="#8a7f70">trending up ↗</text>
</svg>
