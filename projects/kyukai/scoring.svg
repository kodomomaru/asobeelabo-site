<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of live scoring in Kyukai: each archer's arrows marked as circles for hits and crosses for misses, with totals and a closest-to-centre target">
  <rect width="800" height="450" rx="24" fill="#d9482b" opacity="0.12"/>
  <rect x="40" y="36" width="720" height="378" rx="18" fill="#f5efe3"/>
  <circle cx="74" cy="72" r="7" fill="#d9482b"/>
  <text x="90" y="78" font-family="sans-serif" font-size="14" fill="#d9482b" font-weight="700">LIVE</text>
  <text x="140" y="78" font-family="'Shippori Mincho', Georgia, serif" font-size="20" font-weight="700" fill="#2b2522">Autumn Taikai · Round 2</text>
  <g font-family="sans-serif" font-size="15" fill="#2b2522">
    <text x="70" y="128" font-size="11" fill="#8a7f70">ARCHER</text>
    <text x="250" y="128" font-size="11" fill="#8a7f70">1</text><text x="300" y="128" font-size="11" fill="#8a7f70">2</text><text x="350" y="128" font-size="11" fill="#8a7f70">3</text><text x="400" y="128" font-size="11" fill="#8a7f70">4</text>
    <text x="446" y="128" font-size="11" fill="#8a7f70">HITS</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#2b2522">
    <g transform="translate(0 0)">
      <rect x="60" y="140" width="430" height="52" rx="10" fill="#fff"/>
      <text x="76" y="172">Aiko S.</text>
      <circle cx="254" cy="166" r="11" fill="none" stroke="#2b2522" stroke-width="3"/>
      <circle cx="304" cy="166" r="11" fill="none" stroke="#2b2522" stroke-width="3"/>
      <path d="M344 158 l14 16 M358 158 l-14 16" stroke="#d9482b" stroke-width="3" stroke-linecap="round"/>
      <circle cx="404" cy="166" r="11" fill="none" stroke="#2b2522" stroke-width="3"/>
      <text x="456" y="172" font-weight="700">3</text>
    </g>
    <g transform="translate(0 62)">
      <rect x="60" y="140" width="430" height="52" rx="10" fill="#fff"/>
      <text x="76" y="172">Ken T.</text>
      <circle cx="254" cy="166" r="11" fill="none" stroke="#2b2522" stroke-width="3"/>
      <circle cx="304" cy="166" r="11" fill="none" stroke="#2b2522" stroke-width="3"/>
      <circle cx="354" cy="166" r="11" fill="none" stroke="#2b2522" stroke-width="3"/>
      <circle cx="404" cy="166" r="11" fill="none" stroke="#2b2522" stroke-width="3"/>
      <text x="456" y="172" font-weight="700">4</text>
    </g>
    <g transform="translate(0 124)">
      <rect x="60" y="140" width="430" height="52" rx="10" fill="#fff" stroke="#d9482b" stroke-width="2"/>
      <text x="76" y="172">Mei L.</text>
      <path d="M244 158 l14 16 M258 158 l-14 16" stroke="#d9482b" stroke-width="3" stroke-linecap="round"/>
      <circle cx="304" cy="166" r="11" fill="none" stroke="#2b2522" stroke-width="3"/>
      <rect x="342" y="154" width="24" height="24" rx="12" fill="none" stroke="#c9b8a0" stroke-width="2" stroke-dasharray="4 4"/>
      <text x="456" y="172" font-weight="700">1</text>
    </g>
  </g>
  <!-- record buttons -->
  <g font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="160" y="346" width="120" height="48" rx="24" fill="#2b2522"/><text x="220" y="378" fill="#fff">○ Hit</text>
    <rect x="300" y="346" width="120" height="48" rx="24" fill="#d9482b"/><text x="360" y="378" fill="#fff">× Miss</text>
  </g>
  <!-- closest to centre target -->
  <g transform="translate(620 230)">
    <circle r="100" fill="#1d1b1a"/><circle r="85" fill="#f5efe3"/><circle r="68" fill="#1d1b1a"/><circle r="55" fill="#f5efe3"/><circle r="40" fill="#1d1b1a"/><circle r="27" fill="#f5efe3"/>
    <circle cx="14" cy="-9" r="7" fill="#d9482b" stroke="#fff" stroke-width="2"/>
    <circle cx="-31" cy="22" r="7" fill="#3b4a8a" stroke="#fff" stroke-width="2"/>
    <text y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a7f70">Closest to centre</text>
  </g>
</svg>
